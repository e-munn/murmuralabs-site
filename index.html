        <h1>Murmura Labs — Urban Foresight Platform</h1>
        <p><strong>murmur</strong> reveals the second-order effects of urban decisions before they are made.</p>
        <p>With 100+ real-world data fields per cell covering demographics, health, pollution, housing, transit, amenities, schools, and network metrics, murmur models cascading impacts across every neighborhood.</p>
        <h2>Platform Capabilities</h2>
        <ul>
          <li>100+ data fields per cell: demographics, health, housing, environment, mobility, education, economy</li>
          <li>Scenario modeling: test infrastructure changes, policy shifts, and investment scenarios</li>
          <li>Equity-first analysis: distributional impacts, displacement risk, vulnerability propagation</li>
          <li>Network intelligence: commute flows, economic ties, demographic similarity, transit, schools</li>
        </ul>
        <h2>About</h2>
